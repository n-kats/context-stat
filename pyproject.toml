[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "context-stat"
version = "0.1.0"
description = "Measure context-sized inputs for coding agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "click>=8.4,<9",
  "Jinja2>=3.1,<4",
  "mcp>=2,<2.1",
  "Pillow>=11,<13",
  "rich>=13,<15",
  "tiktoken>=0.9,<1",
]

[project.optional-dependencies]
tokenizers = ["tokenizers>=0.21,<1"]
anthropic-api = ["anthropic>=0.117,<1"]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
context-stat = "context_stat.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/context_stat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "_local", "_tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
